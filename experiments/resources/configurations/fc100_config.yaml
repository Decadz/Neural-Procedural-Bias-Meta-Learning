# Few-Shot-Learning Settings.
num_ways: 5
num_shots: 5
test_shots: 15
test_tasks: 600

# Meta Optimization used in Meta-Training.
meta_gradient_steps: 60000
meta_batch_size: 4
meta_optimizer_name: "adam"
meta_optimizer_settings:
  lr: 0.001

meta_scheduler_name: "cosine"
meta_scheduler_settings:
  T_max: 60000
  eta_min: 0.00001

# Base Optimization used in Meta-Training.
base_gradient_steps: 5
base_optimizer_name: "sgd"
base_optimizer_settings:
  lr: 0.01
  momentum: 0
  nesterov: False
  weight_decay: 0

base_bootstrapped_gradient_steps: 5
base_bootstrapped_optimizer_name: "sgd"
base_bootstrapped_optimizer_settings:
  lr: 0.0001
  momentum: 0
  nesterov: False
  weight_decay: 0

# Meta Transfer Learning (Initialization).
pretrain_gradient_steps: 200000
pretrain_batch_size: 128
pretrain_optimizer_name: "sgd"
pretrain_optimizer_settings:
  lr: 0.1
  momentum: 0.9
  nesterov: True
  weight_decay: 0.0005

pretrain_scheduler_name: "multistep"
pretrain_scheduler_settings:
  milestones: [100000, 150000, 175000]
  gamma: 0.1

# Learning objective and performance metric.
evaluation_metric: "multierrorrate"
task_loss_function: "celoss"
matching_loss_function: "mseloss"

# Experiment Settings
output_path: results/fc100/
input_channels: 3
verbose: 2
